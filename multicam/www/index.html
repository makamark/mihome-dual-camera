<!DOCTYPE html>
<html lang="zh-CN" data-ui-state="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米家双路摄像头</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">米家双路摄像头 <span class="ver" id="ver"></span></div>
    <div class="state" id="state-badge">加载中…</div>
  </header>

  <div class="layout">
    <div class="col-main">
      <section class="card">
        <h2>实时画面
          <button id="pv-toggle" class="btn small">关闭预览</button>
        </h2>
        <div class="preview-wrap">
          <img id="pv-src" alt="" crossorigin="anonymous">
          <canvas id="pv-canvas"></canvas>
        </div>
        <p class="hint" id="zone-info"></p>
      </section>

      <section class="card card-compact">
        <h2>运行状态</h2>
        <div class="tiles-row" id="tiles-row"></div>
        <p class="hint" id="uptime-line"></p>
      </section>
    </div>

    <div class="col-side">
      <section class="card card-compact">
        <h2>输出</h2>
        <div class="field">
          <label for="fps">画面刷新频率</label>
          <select id="fps">
            <option value="3">3 · 较省电</option>
            <option value="5">5 · 推荐</option>
            <option value="10">10 · 更流畅</option>
          </select>
        </div>
      </section>

      <details class="card fold" id="auth-card">
        <summary>账号授权 <span class="state" id="auth-summary-state">…</span></summary>
        <div class="fold-body" id="auth-body"></div>
      </details>

      <details class="card fold">
        <summary>鸣谢</summary>
        <div class="fold-body">
          <ul class="credits">
            <li><b>go2rtc</b><span>摄像头取流核心</span><i>MIT</i></li>
            <li><b>mhcamera</b><span>米家接入与授权参考</span><i>MIT</i></li>
            <li><b>FFmpeg</b><span>拉流、解码与画面编码</span><i>LGPL-2.1+</i></li>
            <li><b>cJSON</b><span>数据解析</span><i>MIT</i></li>
            <li><b>AINICE SDK</b><span>插件运行时与检测管线</span><i>设备内置</i></li>
          </ul>
        </div>
      </details>
    </div>
  </div>

  <section class="card card-cams">
    <h2>摄像头 <button id="cam-refresh" class="btn small">刷新设备列表</button></h2>
    <div id="cam-list"></div>
    <button id="cam-add" class="btn small">+ 添加摄像头</button>
  </section>

  <div class="save-bar">
    <span id="save-msg"></span>
    <button id="save" class="btn primary big">保存并应用</button>
  </div>
</div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
